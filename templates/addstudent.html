<!DOCTYPE html>
<html>
<head>
<title>Add Student</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

.navbar{
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
padding:20px;
text-align:center;
}

.container{
width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
margin-bottom:20px;
color:#1e3c72;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:14px;
background:#2a5298;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1e3c72;
}

</style>

</head>
<body>

<div class="navbar">
<h1>Add Student</h1>
</div>

<div class="container">

<form method="POST" action="/add_student">

<input type="number" name="student_id" placeholder="Student ID" required>

<input type="text" name="name" placeholder="Student Name" required>

<input type="number" name="age" placeholder="Age" required>

<input type="text" name="cource" placeholder="Cource" required>

<button type="submit">
Add Student
</button>
<br><br>

<a href="/dashboard">BACK TO Dashboard</a>

</form>

</div>

</body>
</html>
