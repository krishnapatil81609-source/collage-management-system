<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1e3c72,#2a5298);
}

.login-container{
    width:400px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#1e3c72;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2a5298;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2a5298;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1e3c72;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:gray;
}

</style>

<title>Login</title>
</head>
<body>

<div class="login-container">

    <div class="logo">🎓</div>

    <h1>College Management</h1>

    <form action="/" method="POST">

        <div class="input-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter Username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="text" name="password" placeholder="Enter Password" required>
        </div>

        <button type="submit">Login</button>

        <a href="/register">create account</a>

    </form>

    <div class="footer">
        Admin Panel
    </div>

</div>

</body>
</html>
