<!DOCTYPE html>
<html>
<head>
<title>View Students</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:#f4f6f9;
}

.navbar{
background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
padding:20px;
text-align:center;
}

.container{
padding:30px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

th{
background:#2a5298;
color:white;
padding:15px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

.edit{
background:green;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

.delete{
background:red;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

.profile{
background:#2a5298;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

</style>

</head>
<body>

<div class="navbar">
<h1>All Students</h1>
</div>

<div class="container">

<table>

<tr>
<th>ID</th>
<th>STUDENT_ID</th>
<th>Name</th>
<th>Age</th>
<th>Cource</th>

</tr>

{% for student in students %}

<tr>

<td>{{student[0]}}</td>
<td>{{student[1]}}</td>
<td>{{student[2]}}</td>
<td>{{student[3]}}</td>
<td>{{student[4]}}</td>


</tr>

{% endfor %}

</table>

</div>

<a href="/dashboard">BACK TO Dashboard</a>

</body>
</html>
