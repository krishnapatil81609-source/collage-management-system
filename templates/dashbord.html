<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f4f6f9;
}

.navbar{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
    padding:20px 50px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.navbar h2{
    font-size:28px;
}

.logout-btn{
    text-decoration:none;
    color:white;
    background:red;
    padding:10px 18px;
    border-radius:8px;
}

.dashboard{
    padding:40px;
}

.welcome{
    margin-bottom:30px;
}

.welcome h1{
    color:#1e3c72;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

.card h2{
    margin-bottom:10px;
    color:#1e3c72;
}

.card p{
    margin-bottom:20px;
    color:gray;
}

.card a{
    text-decoration:none;
    background:#2a5298;
    color:white;
    padding:10px 20px;
    border-radius:8px;
}

.stats{
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.stat-box{
    background:white;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.stat-box h1{
    color:#2a5298;
    margin-bottom:10px;
}
.contact-section{
    margin-top:40px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.contact-section h2{
    color:#1e3c72;
    margin-bottom:20px;
}

.contact-form input,
.contact-form textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.contact-form textarea{
    resize:none;
    height:120px;
}

.contact-form button{
    background:#2a5298;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.contact-form button:hover{
    background:#1e3c72;
}

</style>

<title>Dashboard</title>
</head>
<body>

<div class="dashboard">

    <div class="welcome">
        <h1>Welcome Admin 👋</h1>
        <p>Manage students and records easily.</p>
    </div>

    <div class="cards">

        <div class="card">
            <div class="icon">➕</div>
            <h2>Add Student</h2>
            <p>Add new student records.</p>
            <a href="/add_student">Open</a>
        </div>

        <div class="card">
            <div class="icon">📋</div>
            <h2>View Students</h2>
            <p>See all registered students.</p>
            <a href="/student_view">Open</a>
        </div>


        <div class="card">
            <div class="icon">📊</div>
            <h2>Delete Students</h2>
            <p>Delete student Details</p>
            <a href="/delete">Open</a>
        </div>

    </div>

    <div class="stats">

        <div class="stat-box">
            <h1>{{total_students}}</h1>
        </div>
    </div>

</div>
<div class="contact-section">

    <h2>Contact Admin 📧</h2>

    <form class="contact-form" method="POST" action= "https://formspree.io/f/xojodvaq" >

        <input
            type="text"
            name="name"
            placeholder="Enter Your Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Enter Your Email"
            required>

        <textarea
            name="message"
            placeholder="Write Your Message..."
            required></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</div>

</body>
</html>
